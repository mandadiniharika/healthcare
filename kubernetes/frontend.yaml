apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsecare-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsecare-frontend
  template:
    metadata:
      labels:
        app: pulsecare-frontend
    spec:
      containers:
        - name: frontend
          image: healthcare-pulsecare-advanced-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pulsecare-frontend
spec:
  selector:
    app: pulsecare-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP