apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulsecare-mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsecare-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsecare-mongodb
  template:
    metadata:
      labels:
        app: pulsecare-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: pulsecare-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: pulsecare-mongodb
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP